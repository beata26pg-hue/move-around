<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Move around">
    <title>Move around</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/app.js" defer></script>


</head>

<body>
    <main class="container">
        <div class="allowed-space">
            <div id="movable-element">
                <img src="./assets/images/happy.png" width="200" height="180">
            </div>
        </div>
    </main>
    <div class="guide">
        <div class="arrows">
            <div><span class="up"></span>Flytt opp </div>
            <div><span class="down"></span>Flytt ned</div>
            <div><span class="left"></span> Flytt mot venstre</div>
            <div><span class="right"></span>Flytt mot høyre.</div>
        </div>
        <p> Prøv å flytte smiley i forskjellige retninger, og se hvor langt du kan bevege den.</p>
    </div>
</body>

</html>
